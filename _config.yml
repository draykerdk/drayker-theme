# Defaults for the theme's own preview build. Consuming repositories set their own
# title, description and dk_* values; see README.md.
title: Drayker theme
description: "A shared reading experience for the documentation. The Drayker theme provides a common Jekyll layout for component documentation, connecting each subdomain to the visual identity and navigation of the wider system."
dk_kicker: Design kit
dk_subdomain: drayker-theme
dk_repo: https://github.com/draykerdk/drayker-theme

plugins:
  - jekyll-optional-front-matter

defaults:
  - scope:
      path: ""
    values:
      layout: default
